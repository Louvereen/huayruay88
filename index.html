<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HUAYRUAY88</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { font-family: -apple-system, sans-serif; background:#f5f5f5; padding:15px; }
.card { background:white; padding:15px; border-radius:16px; margin-bottom:15px; }

input, button {
  width:100%; padding:14px; margin:5px 0;
  font-size:16px; border-radius:10px;
}

button { border:none; }
.primary { background:#007aff; color:white; }
.secondary { background:#eee; }
.danger { background:#ff3b30; color:white; }

.grid {
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:5px;
}

.col { display:flex; flex-direction:column; gap:5px; }

.cell {
  background:white;
  padding:6px;
  border-radius:8px;
  text-align:center;
  font-size:12px;
}

.top { background:#ff3b30; color:white; }
.high { background:#ff9500; color:white; }

.file { color:blue; cursor:pointer; }
.hidden { display:none; }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="card">
  <h2>📁 เลือกไฟล์</h2>
  <input id="newName" placeholder="ตั้งชื่อไฟล์">
  <button class="primary" onclick="createFile()">สร้างใหม่</button>
  <div id="fileList"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="card">
  <h2 id="fileTitle"></h2>

  <input id="num" placeholder="เลข 3 หลัก">
  <input id="qty" type="number" placeholder="จำนวน">

  <button class="primary" onclick="addData()">เพิ่ม</button>

  <input id="search" placeholder="🔎 ค้นหาเลข" oninput="calculate()">

  <button class="secondary" onclick="calculate()">สรุป</button>
  <button class="secondary" onclick="exportExcel()">Export Excel</button>
</div>

<div class="card">
  <h3>🕘 ล่าสุด</h3>
  <div id="recentList"></div>
</div>

<div class="card">
  <h3>📊 ผลลัพธ์</h3>
  <div id="grid" class="grid"></div>
  <h3 id="total"></h3>
</div>

<div class="card">
  <button class="danger" onclick="resetConfirm()">Reset</button>
</div>

</div>

<script>
let data={}, history=[], currentFile="";

function loadFiles(){
  let list=document.getElementById("fileList");
  list.innerHTML="";
  Object.keys(localStorage).forEach(f=>{
    let d=document.createElement("div");
    d.innerText=f;
    d.className="file";
    d.onclick=()=>openFile(f);
    list.appendChild(d);
  });
}

function createFile(){
  let n=document.getElementById("newName").value.trim();
  if(!n) return alert("ตั้งชื่อก่อน");
  localStorage.setItem(n,"{}");
  openFile(n);
}

function openFile(n){
  currentFile=n;
  data=JSON.parse(localStorage.getItem(n))||{};
  history=[];
  document.getElementById("home").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("fileTitle").innerText=n;
  calculate();
}

function save(){
  localStorage.setItem(currentFile,JSON.stringify(data));
}

function addData(){
  let num=document.getElementById("num").value.trim();
  let qty=parseFloat(document.getElementById("qty").value);
  if(!/^\d{3}$/.test(num)||isNaN(qty)) return;

  data[num]=(data[num]||0)+qty;

  history.unshift({num,qty});
  history=history.slice(0,5);

  document.getElementById("num").value="";
  document.getElementById("qty").value="";

  save();
  renderRecent();
}

function renderRecent(){
  let div=document.getElementById("recentList");
  div.innerHTML="";
  history.forEach((h,i)=>{
    let el=document.createElement("div");
    el.innerHTML=`
      ${h.num} (${h.qty})
      <button onclick="editRecent(${i})">✏️</button>
      <button onclick="deleteRecent(${i})">❌</button>
    `;
    div.appendChild(el);
  });
}

function editRecent(i){
  let h=history[i];
  document.getElementById("num").value=h.num;
  document.getElementById("qty").value=h.qty;
}

function deleteRecent(i){
  let h=history[i];
  data[h.num]-=h.qty;
  if(data[h.num]<=0) delete data[h.num];
  history.splice(i,1);
  save();
  renderRecent();
  calculate();
}

function calculate(){
  let search=document.getElementById("search").value.trim();

  let groups={};
  for(let i=0;i<10;i++) groups[i]=[];

  let values=Object.values(data);
  let max=Math.max(...values,0);
  let sorted=[...values].sort((a,b)=>b-a);
  let threshold=sorted[Math.floor(sorted.length*0.2)]||0;

  let total=0;

  Object.keys(data).sort().forEach(num=>{
    if(search && !num.includes(search)) return;

    let val=data[num];
    total+=val;
    groups[num[0]].push({num,val});
  });

  let grid=document.getElementById("grid");
  grid.innerHTML="";

  for(let i=0;i<10;i++){
    let col=document.createElement("div");
    col.className="col";

    groups[i].sort((a,b)=>a.num.localeCompare(b.num));

    groups[i].forEach(item=>{
      let cls="cell";
      if(item.val===max) cls+=" top";
      else if(item.val>=threshold) cls+=" high";

      let d=document.createElement("div");
      d.className=cls;
      d.innerHTML=`${item.num}<br>${item.val}`;
      col.appendChild(d);
    });

    grid.appendChild(col);
  }

  document.getElementById("total").innerText="รวม: "+total;
}

function exportExcel(){
  let groups={};
  for(let i=0;i<10;i++) groups[i]=[];

  Object.keys(data).sort().forEach(num=>{
    groups[num[0]].push({num,val:data[num]});
  });

  for(let i=0;i<10;i++){
    groups[i].sort((a,b)=>a.num.localeCompare(b.num));
  }

  let maxLen=Math.max(...Object.values(groups).map(g=>g.length),0);

  let sheet=[];
  sheet.push(["0xx","1xx","2xx","3xx","4xx","5xx","6xx","7xx","8xx","9xx"]);

  for(let r=0;r<maxLen;r++){
    let row=[];
    for(let i=0;i<10;i++){
      if(groups[i][r]){
        row.push(groups[i][r].num+" ("+groups[i][r].val+")");
      }else row.push("");
    }
    sheet.push(row);
  }

  let ws=XLSX.utils.aoa_to_sheet(sheet);
  let wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Summary");
  XLSX.writeFile(wb,currentFile+".xlsx");
}

function resetConfirm(){
  if(confirm("ลบทั้งหมด?") && confirm("ยืนยันอีกครั้ง?")){
    data={};
    save();
    calculate();
  }
}

document.getElementById("qty").addEventListener("keypress",e=>{
  if(e.key==="Enter") addData();
});

loadFiles();
</script>

</body>
</html>
